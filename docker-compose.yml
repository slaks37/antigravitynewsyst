version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: newsystem-postgres
    restart: always
    environment:
      POSTGRES_USER: newsystem
      POSTGRES_PASSWORD: newsystem_secret_password
      POSTGRES_DB: newsystem_db
    ports:
      - "5432:5432"
    volumes:
      - newsystem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsystem -d newsystem_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  newsystem_pgdata:
